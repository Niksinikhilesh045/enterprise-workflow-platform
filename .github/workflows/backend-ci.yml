name: backend-ci

on:
  push:
    paths:
      - "services/api/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Tidy modules
        run: go mod tidy
      - name: Format source
        run: gofmt -w .
      - name: Run unit tests with race detector
        run: go test -race ./...
      - name: Upload formatted backend source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-api-source
          path: services/api

  mongo-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Start MongoDB replica set
        run: |
          docker compose up -d mongodb mongo-init
          for i in {1..30}; do
            if docker compose exec -T mongodb mongosh --quiet --eval 'rs.status().ok' | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs mongodb mongo-init
          exit 1
      - name: Run MongoDB integration tests
        working-directory: services/api
        env:
          MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
        run: |
          go mod tidy
          go test -tags=integration ./internal/store -run TestMongoStoreEndToEnd -v

  event-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Start MongoDB and Kafka
        run: |
          docker compose up -d mongodb mongo-init kafka
          for i in {1..30}; do
            MONGO_OK=0
            KAFKA_OK=0
            docker compose exec -T mongodb mongosh --quiet --eval 'rs.status().ok' | grep -q 1 && MONGO_OK=1 || true
            docker compose exec -T kafka /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && KAFKA_OK=1 || true
            if [ "$MONGO_OK" = "1" ] && [ "$KAFKA_OK" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs mongodb mongo-init kafka
          exit 1
      - name: Verify Kafka-to-Mongo idempotency
        working-directory: services/api
        env:
          MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
          KAFKA_BROKERS: localhost:9092
        run: |
          go mod tidy
          go test -tags=integration ./internal/events -run TestKafkaMongoNotificationIdempotency -v
